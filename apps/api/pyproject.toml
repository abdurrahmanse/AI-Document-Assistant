[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for AI Document Intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "redis>=8.1.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6.7",
    "pyright>=1.1.382",
    "pytest>=8.3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
