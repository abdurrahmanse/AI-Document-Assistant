[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for AI Document Intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "redis>=8.1.0",
    "loguru>=0.7.3",
    "sentry-sdk[fastapi]>=2.0.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    "greenlet>=3.5.5",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=25.1.0",
    "alembic>=1.19.1",
    "pgvector>=0.5.0",
    "psycopg>=3.3.4",
    "psycopg-pool>=3.3.1",
    "aioboto3>=15.5.0",
    "boto3>=1.40.61",
    "celery>=5.6.3",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.3.1",
    "tiktoken>=0.14.0",
    "fastapi-limiter==0.1.6",
    "structlog>=25.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.7",
    "pyright>=1.1.382",
    "pytest>=8.3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
